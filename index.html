<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>soodye - لوحة إدارة البيانات والرقابة</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- الخط العربي -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --danger: #ef4444;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }
    body {
      background: #f8fafc;
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 2px solid #0284c7;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.08);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stats-badge {
      font-size: 12px;
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: bold;
    }
    .container {
      display: grid;
      grid-template-columns: 280px 320px 1fr;
      flex: 1;
      overflow: hidden;
    }
    .panel {
      border-left: 1px solid var(--border);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .item-card {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      font-size: 12.5px;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #fff;
    }
    .item-card:hover, .item-card.active {
      border-color: #0284c7;
      background: #f0f9ff;
    }
    .btn-delete-small {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 4px;
    }
    .btn-delete-small:hover {
      background: #fecaca;
    }
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      overflow: hidden;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      padding: 12px 16px;
      border-radius: 14px;
      max-width: 85%;
      font-size: 13.5px;
      line-height: 1.6;
      word-break: break-word;
    }
    .bubble.user {
      align-self: flex-start;
      background: #0284c7;
      color: #fff;
      border-bottom-left-radius: 2px;
    }
    .bubble.ai {
      align-self: flex-end;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid var(--border);
      border-bottom-right-radius: 2px;
    }
    .meta-time {
      font-size: 10px;
      opacity: 0.8;
      margin-top: 4px;
      display: block;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>🛡️ soodye - لوحة رقابة وسجلات السيرفر</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <span class="stats-badge" id="usersCount">جاري فحص المستخدمين...</span>
      <button onclick="fetchAllData()" style="padding:6px 12px; background:#0284c7; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">تحديث البيانات</button>
    </div>
  </header>

  <div class="container">
    <!-- قائمة المستخدمين -->
    <div class="panel">
      <div class="panel-header">المستخدمين (الحسابات)</div>
      <div class="list-container" id="usersList"></div>
    </div>

    <!-- قائمة الجلسات والمحادثات للمستخدم المختار -->
    <div class="panel">
      <div class="panel-header">
        <span>محادثات المستخدم</span>
        <button id="delAllUserBtn" class="btn-delete-small" style="display:none;" onclick="deleteSelectedUser()">مسح المستخدم بالكامل</button>
      </div>
      <div class="list-container" id="sessionsList">
        <div style="color:#64748b; font-size:12px; text-align:center; padding:20px;">اختر مستخدماً من القائمة لرؤية سجلاته</div>
      </div>
    </div>

    <!-- استعراض تفاصيل المحادثة المختارة -->
    <div class="chat-view">
      <div class="panel-header" id="chatHeader">تفاصيل الرسائل والبحث</div>
      <div class="chat-box" id="chatBox">
        <div style="color:#64748b; font-size:13px; text-align:center; margin-top:40px;">اختر محادثة لعرض تفاصيلها بالكامل هنا</div>
      </div>
    </div>
  </div>

  <script>
    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyCrK8LlZa3kDRRhj-45AMlOveTBDz8mmN0",
      authDomain: "soodye-9fc2a.firebaseapp.com",
      databaseURL: "https://soodye-9fc2a-default-rtdb.firebaseio.com",
      projectId: "soodye-9fc2a"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let rawData = {};
    let activeUid = null;
    let activeSessionId = null;

    function fetchAllData() {
      document.getElementById("usersCount").innerText = "جاري التحميل...";
      db.ref("users").on("value", snapshot => {
        rawData = snapshot.val() || {};
        renderUsers();
      });
    }

    function renderUsers() {
      const uList = document.getElementById("usersList");
      uList.innerHTML = "";
      const uids = Object.keys(rawData);
      document.getElementById("usersCount").innerText = `إجمالي الحسابات: ${uids.length}`;

      if (uids.length === 0) {
        uList.innerHTML = `<div style="color:#64748b; font-size:12px; padding:10px;">لا يوجد مستخدمون حتى الآن</div>`;
        return;
      }

      uids.forEach(uid => {
        const uData = rawData[uid];
        const sessionsCount = uData.sessions ? Object.keys(uData.sessions).length : 0;
        const card = document.createElement("div");
        card.className = `item-card ${activeUid === uid ? 'active' : ''}`;
        card.innerHTML = `
          <strong style="color:#0284c7; overflow:hidden; text-overflow:ellipsis;">UID: ${uid.slice(0, 14)}...</strong>
          <span style="color:#64748b; font-size:11.5px;">الجلسات المخزنة: ${sessionsCount}</span>
        `;
        card.onclick = () => selectUser(uid);
        uList.appendChild(card);
      });
    }

    function selectUser(uid) {
      activeUid = uid;
      activeSessionId = null;
      renderUsers();
      document.getElementById("delAllUserBtn").style.display = "inline-block";

      const sList = document.getElementById("sessionsList");
      sList.innerHTML = "";
      const sessions = rawData[uid]?.sessions || {};
      const sKeys = Object.keys(sessions);

      if (sKeys.length === 0) {
        sList.innerHTML = `<div style="color:#64748b; font-size:12px; padding:10px;">لا توجد محادثات محفوظة لهذا المستخدم</div>`;
        document.getElementById("chatBox").innerHTML = "";
        return;
      }

      sKeys.reverse().forEach(sId => {
        const s = sessions[sId];
        const card = document.createElement("div");
        card.className = `item-card ${activeSessionId === sId ? 'active' : ''}`;
        card.innerHTML = `
          <strong style="color:#0f172a;">${s.title || 'محادثة بدون عنوان'}</strong>
          <span style="color:#64748b; font-size:11px;">تاريخ آخر تفاعل: ${s.updatedAt ? new Date(s.updatedAt).toLocaleTimeString('ar-EG') : 'غير متوفر'}</span>
          <button class="btn-delete-small" onclick="deleteSession(event, '${uid}', '${sId}')">حذف هذه الجلسة</button>
        `;
        card.onclick = () => selectSession(uid, sId);
        sList.appendChild(card);
      });
    }

    function selectSession(uid, sId) {
      activeSessionId = sId;
      selectUser(uid); // لتحديث النشاط
      const cBox = document.getElementById("chatBox");
      cBox.innerHTML = "";

      const session = rawData[uid]?.sessions?.[sId];
      if (!session || !session.messages) {
        cBox.innerHTML = `<div style="color:#64748b; font-size:13px; text-align:center;">المحادثة فارغة أو تم حذفها</div>`;
        return;
      }

      document.getElementById("chatHeader").innerText = `المحادثة: ${session.title || sId}`;

      Object.values(session.messages).forEach(m => {
        const b = document.createElement("div");
        b.className = `bubble ${m.role === 'user' ? 'user' : 'ai'}`;
        const time = m.timestamp ? new Date(m.timestamp).toLocaleTimeString('ar-EG') : '';
        b.innerHTML = `
          <div><strong>${m.role === 'user' ? 'المستخدم' : (m.modelName || 'soodye')}:</strong></div>
          <div style="margin-top:4px;">${m.content}</div>
          <span class="meta-time">${time}</span>
        `;
        cBox.appendChild(b);
      });

      cBox.scrollTop = cBox.scrollHeight;
    }

    // حذف جلسة فردية
    function deleteSession(e, uid, sId) {
      e.stopPropagation();
      if (confirm("هل تريد حذف هذه الجلسة ومخلفاتها من قاعدة البيانات؟")) {
        db.ref(`users/${uid}/sessions/${sId}`).remove();
      }
    }

    // حذف المستخدم بالكامل بكل جلساته
    function deleteSelectedUser() {
      if (!activeUid) return;
      if (confirm(`هل أنت متأكد من حذف المستخدم بالكامل [${activeUid}] ومسح كافة محادثاته نهائياً؟`)) {
        db.ref(`users/${activeUid}`).remove();
        activeUid = null;
        activeSessionId = null;
        document.getElementById("chatBox").innerHTML = "";
        document.getElementById("sessionsList").innerHTML = "";
        document.getElementById("delAllUserBtn").style.display = "none";
      }
    }

    // التحميل المبدئي فور فتح الصفحة
    window.addEventListener("DOMContentLoaded", fetchAllData);
  </script>
</body>
</html>
